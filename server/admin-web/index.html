<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/sk-icon.svg" />
    <link rel="apple-touch-icon" href="/brand/sk-icon.svg" />
    <meta name="theme-color" content="#2DD4E8" />
    <title>SeceoKnight MDM · Mobile Device Management</title>
    <meta name="description" content="SeceoKnight MDM — Mobile Device Management. Enroll · Secure · Command. By SeceoKnight Technologies." />
    <!-- Type system: IBM Plex Sans — primary UI typeface (matches SeceoKnight SIEM design language);
         Geist Mono — telemetry, serials, hashes, code;
         Bricolage Grotesque — characterful display face for the login hero headline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" />
    <!-- Leaflet — used by the Dashboard fleet map. CDN-hosted so no npm
         dependency is needed; loaded synchronously so window.L is ready
         before React mounts the DeviceMap component. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
  </head>
  <body class="h-full bg-bg text-fg font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
